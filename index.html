
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문화 시설 지도</title>

  <style>
    /* 모든 요소의 크기 계산 방식을 통일합니다. */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #222;
    }

    /* 화면을 왼쪽 검색창과 오른쪽 지도로 나눕니다. */
    .container {
      display: flex;
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }

    /* 왼쪽 검색 패널 */
    .sidebar {
      width: 380px;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      padding: 22px 18px;
      border-right: 1px solid #ddd;
      background: #fff;
      z-index: 1;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .description {
      margin: 0 0 18px;
      color: #777;
      font-size: 13px;
    }

    /* 문화 시설 탭 */
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .tab-button {
      flex: 1;
      padding: 11px 4px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
      color: #555;
      font-size: 14px;
      cursor: pointer;
    }

    .tab-button.active {
      border-color: #333;
      background: #333;
      color: white;
      font-weight: bold;
    }

    /* 장소 검색창 */
    .search-form {
      display: flex;
      gap: 8px;
    }

    #searchInput {
      flex: 1;
      width: 0;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    #searchButton {
      flex-shrink: 0;
      padding: 0 16px;
      border: none;
      border-radius: 8px;
      background: #4285f4;
      color: white;
      cursor: pointer;
    }

    #searchButton:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    /* 검색 상태 안내 */
    #status {
      margin: 12px 0;
      color: #666;
      font-size: 12px;
      line-height: 1.6;
    }

    /* 마커 색상 범례 */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      padding: 10px 0;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
      color: #555;
      font-size: 11px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .art-color {
      background: #f06292;
    }

    .museum-color {
      background: #4285f4;
    }

    .exhibition-color {
      background: #fbc02d;
    }

    .other-color {
      background: #8e63ce;
    }

    .current-color {
      background: #20b9a6;
    }

    /* 검색 결과 목록 */
    #resultList {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    .result-item {
      padding: 14px 8px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .result-item:hover,
    .result-item:focus {
      background: #f4f7ff;
      outline: 2px solid #4285f4;
    }

    .place-name {
      margin-bottom: 6px;
      font-size: 15px;
      font-weight: bold;
    }

    .place-category,
    .place-address,
    .place-phone {
      margin-top: 5px;
      color: #666;
      font-size: 12px;
      line-height: 1.5;
    }

    .place-link {
      display: inline-block;
      margin-top: 8px;
      color: #2868c7;
      font-size: 12px;
      text-decoration: none;
    }

    /* 오른쪽 지도 */
    #map {
      flex: 1;
      min-width: 0;
      height: 100%;
      background: #f0f2f5;
    }

    /* 작은 화면에서는 위쪽에 검색창, 아래쪽에 지도를 배치합니다. */
    @media (max-width: 600px) {
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        min-width: 0;
        height: 48%;
        min-height: 280px;
        padding: 12px;
      }

      h1 {
        font-size: 20px;
      }

      .description {
        margin-bottom: 10px;
      }

      #status {
        margin: 8px 0;
      }

      #map {
        width: 100%;
        height: 52%;
        min-height: 180px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- 왼쪽: 문화 시설 검색 -->
    <aside class="sidebar">
      <h1>문화 시설 지도</h1>
      <p class="description">내 주변의 문화 공간을 찾아보세요.</p>

      <!-- 세 가지 탭으로 문화 시설을 구분합니다. -->
      <div class="tabs" role="tablist" aria-label="문화 시설 종류">
        <button
          type="button"
          class="tab-button active"
          data-tab="art"
          role="tab"
          aria-selected="true"
        >미술관</button>

        <button
          type="button"
          class="tab-button"
          data-tab="museum"
          role="tab"
          aria-selected="false"
        >박물관</button>

        <button
          type="button"
          class="tab-button"
          data-tab="other"
          role="tab"
          aria-selected="false"
        >기타</button>
      </div>

      <!-- 현재 선택한 탭 안에서 장소를 검색합니다. -->
      <form class="search-form" id="searchForm">
        <input
          type="text"
          id="searchInput"
          placeholder="장소 이름 검색"
          aria-label="장소 이름 검색"
          autocomplete="off"
        >
        <button type="submit" id="searchButton">검색</button>
      </form>

      <p id="status" role="status" aria-live="polite">
        지도를 불러오는 중입니다.
      </p>

      <!-- 마커 색상을 안내합니다. -->
      <div class="legend">
        <span class="legend-item">
          <span class="legend-dot art-color"></span>미술관
        </span>
        <span class="legend-item">
          <span class="legend-dot museum-color"></span>박물관
        </span>
        <span class="legend-item">
          <span class="legend-dot exhibition-color"></span>전시·박람회
        </span>
        <span class="legend-item">
          <span class="legend-dot other-color"></span>기타
        </span>
        <span class="legend-item">
          <span class="legend-dot current-color"></span>현재 위치
        </span>
      </div>

      <div id="resultList"></div>
    </aside>

    <!-- 오른쪽: 카카오 지도 -->
    <main id="map" aria-label="문화 시설 지도"></main>
  </div>

  <!-- 카카오 지도 SDK와 장소 검색 서비스를 불러옵니다. -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=0bce71f318cc62bbe2897adf4bda0b34&libraries=services&autoload=false"
    onerror="document.getElementById('status').textContent='카카오맵 SDK를 불러오지 못했습니다. 네트워크와 API 키를 확인하세요.'"
  ></script>

  <script>
    // 기본 지도 위치는 서울시청이며 확대 레벨은 5입니다.
    const defaultLatitude = 37.5665;
    const defaultLongitude = 126.9780;
    const mapLevel = 5;

    // 지도와 검색 기능에 필요한 변수를 선언합니다.
    let map = null;
    let placesService = null;
    let infoWindow = null;
    let currentMarker = null;
    let currentPosition = null;

    // 검색 마커와 검색 결과를 별도로 관리합니다.
    let placeMarkers = [];
    let placeMap = new Map();

    // 탭 전환과 검색 요청을 구분하기 위한 번호입니다.
    let currentTab = "art";
    let searchRequestId = 0;

    const searchForm = document.getElementById("searchForm");
    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const resultList = document.getElementById("resultList");
    const statusText = document.getElementById("status");
    const tabButtons = document.querySelectorAll(".tab-button");

    // 탭별 검색어와 기본 마커 색상을 설정합니다.
    const tabSettings = {
      art: {
        label: "미술관",
        keywords: ["미술관", "아트 갤러리"],
        color: "#f06292"
      },
      museum: {
        label: "박물관",
        keywords: ["박물관"],
        color: "#4285f4"
      },
      other: {
        label: "기타 문화 시설",
        keywords: [
          "전시관",
          "전시장",
          "전시회",
          "박람회",
          "문화예술회관",
          "문화센터",
          "과학관",
          "기념관"
        ],
        color: "#8e63ce"
      }
    };

    // 안내 문구를 변경합니다.
    function setStatus(message) {
      statusText.textContent = message;
    }

    // 기존 검색 마커와 장소 정보를 모두 초기화합니다.
    function clearPlaces() {
      placeMarkers.forEach(function(marker) {
        marker.setMap(null);
      });

      placeMarkers = [];
      placeMap.clear();
      resultList.replaceChildren();

      if (infoWindow) {
        infoWindow.close();
      }
    }

    // 마커의 종류에 따라 색상을 결정합니다.
    function getPlaceColor(place, tab) {
      const text = (
        (place.place_name || "") + " " +
        (place.category_name || "")
      ).toLowerCase();

      if (
        text.includes("미술관") ||
        text.includes("아트 갤러리") ||
        text.includes("art gallery")
      ) {
        return "#f06292";
      }

      if (text.includes("박물관")) {
        return "#4285f4";
      }

      if (
        text.includes("전시") ||
        text.includes("박람회") ||
        text.includes("expo")
      ) {
        return "#fbc02d";
      }

      return tabSettings[tab].color;
    }

    // SVG로 색상이 다른 지도 마커 이미지를 만듭니다.
    function createMarkerImage(color) {
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg"
             width="32" height="42" viewBox="0 0 32 42">
          <path d="M16 1 C7.7 1 1 7.7 1 16
                   C1 26 16 41 16 41
                   C16 41 31 26 31 16
                   C31 7.7 24.3 1 16 1Z"
                fill="${color}" stroke="white" stroke-width="2"/>
          <circle cx="16" cy="16" r="5" fill="white"/>
        </svg>
      `;

      const imageUrl =
        "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(svg);

      return new kakao.maps.MarkerImage(
        imageUrl,
        new kakao.maps.Size(32, 42),
        {
          offset: new kakao.maps.Point(16, 42)
        }
      );
    }

    // 장소 이름과 주소를 안전하게 팝업에 표시합니다.
    function showPlaceInfo(place, marker) {
      const content = document.createElement("div");
      content.style.cssText =
        "padding:10px 12px;max-width:240px;" +
        "font-size:13px;line-height:1.6;";

      const name = document.createElement("strong");
      name.textContent = place.place_name;

      const address = document.createElement("div");
      address.style.cssText = "margin-top:4px;color:#555;";
      address.textContent =
        place.road_address_name ||
        place.address_name ||
        "주소 정보 없음";

      content.append(name, address);

      infoWindow.setContent(content);
      infoWindow.open(map, marker);
    }

    // 검색 결과 하나를 지도와 왼쪽 목록에 추가합니다.
    function addPlace(place, tab) {
      const placeId = String(place.id);

      // 같은 장소가 여러 검색어에서 나왔으면 한 번만 표시합니다.
      if (placeMap.has(placeId)) {
        return;
      }

      placeMap.set(placeId, place);

      const position = new kakao.maps.LatLng(
        Number(place.y),
        Number(place.x)
      );

      // 장소 종류에 맞는 색상의 마커를 생성합니다.
      const marker = new kakao.maps.Marker({
        map: map,
        position: position,
        image: createMarkerImage(getPlaceColor(place, tab)),
        title: place.place_name
      });

      placeMarkers.push(marker);

      // 마커를 누르면 이름과 주소를 팝업으로 표시합니다.
      kakao.maps.event.addListener(marker, "click", function() {
        showPlaceInfo(place, marker);
      });

      // 왼쪽 결과 목록을 만듭니다.
      const item = document.createElement("article");
      item.className = "result-item";
      item.tabIndex = 0;

      const name = document.createElement("div");
      name.className = "place-name";
      name.style.color = getPlaceColor(place, tab);
      name.textContent = place.place_name;

      const category = document.createElement("div");
      category.className = "place-category";
      category.textContent =
        place.category_name || "분류 정보 없음";

      const address = document.createElement("div");
      address.className = "place-address";
      address.textContent =
        place.road_address_name ||
        place.address_name ||
        "주소 정보 없음";

      item.append(name, category, address);

      // 전화번호가 있으면 함께 표시합니다.
      if (place.phone) {
        const phone = document.createElement("div");
        phone.className = "place-phone";
        phone.textContent = place.phone;
        item.appendChild(phone);
      }

      // 카카오맵 장소 상세 페이지 링크를 추가합니다.
      if (place.place_url) {
        const link = document.createElement("a");
        link.className = "place-link";
        link.href = place.place_url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "카카오맵에서 보기";

        link.addEventListener("click", function(event) {
          event.stopPropagation();
        });

        item.appendChild(link);
      }

      // 목록을 선택하면 지도 중심과 팝업을 변경합니다.
      function selectPlace() {
        map.setCenter(position);
        map.setLevel(mapLevel);
        showPlaceInfo(place, marker);
      }

      item.addEventListener("click", selectPlace);

      item.addEventListener("keydown", function(event) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          selectPlace();
        }
      });

      resultList.appendChild(item);
    }

    // 기타 탭에서 미술관과 박물관 결과를 제외합니다.
    function isOtherPlace(place) {
      const text = (
        (place.place_name || "") + " " +
        (place.category_name || "")
      ).toLowerCase();

      return !(
        text.includes("미술관") ||
        text.includes("박물관") ||
        text.includes("art museum")
      );
    }

    // 현재 탭에 맞는 장소를 검색합니다.
    function searchPlaces(tab, customKeyword) {
      if (!map || !placesService) {
        setStatus("지도가 준비되지 않았습니다. 잠시 후 다시 시도하세요.");
        return;
      }

      const requestId = ++searchRequestId;
      const settings = tabSettings[tab];

      // 검색을 시작하면 기존 결과를 지웁니다.
      clearPlaces();
      searchButton.disabled = true;

      const keyword = customKeyword.trim();

      // 직접 입력한 검색어가 있으면 그 검색어를 우선 사용합니다.
      const keywords = keyword
        ? [keyword]
        : settings.keywords;

      let completedCount = 0;
      let errorCount = 0;
      let zeroResultCount = 0;

      setStatus(settings.label + " 검색 중입니다.");

      // 여러 검색어의 결과를 하나의 목록으로 합칩니다.
      keywords.forEach(function(searchKeyword) {
        // 지도에 현재 보이는 영역을 기준으로 검색합니다.
        const options = {
          useMapBounds: true,
          sort: kakao.maps.services.SortBy.ACCURACY,
          size: 15
        };

        placesService.keywordSearch(
          searchKeyword,
          function(data, status, pagination) {
            // 이전 탭의 검색 결과는 화면에 반영하지 않습니다.
            if (requestId !== searchRequestId) {
              return;
            }

            console.log(
              "[문화 시설 검색]",
              searchKeyword,
              "상태:",
              status,
              "결과 수:",
              data ? data.length : 0
            );

            if (status === kakao.maps.services.Status.OK) {
              data.forEach(function(place) {
                // 기타 탭에서는 미술관과 박물관을 제외합니다.
                if (tab === "other" && !isOtherPlace(place)) {
                  return;
                }

                addPlace(place, tab);
              });

              // 검색 결과의 다음 페이지도 순서대로 가져옵니다.
              if (pagination && pagination.hasNextPage) {
                pagination.nextPage();
              } else {
                finishSearch();
              }

            } else if (
              status === kakao.maps.services.Status.ZERO_RESULT
            ) {
              zeroResultCount++;
              finishSearch();

            } else {
              errorCount++;
              console.error(
                "카카오 장소 검색 오류:",
                searchKeyword,
                status
              );
              finishSearch();
            }
          },
          options
        );
      });

      // 모든 검색 요청이 끝났을 때 상태를 표시합니다.
      function finishSearch() {
        completedCount++;

        if (completedCount < keywords.length) {
          return;
        }

        // 탭을 바꿨다면 이전 검색의 상태를 표시하지 않습니다.
        if (requestId !== searchRequestId) {
          return;
        }

        searchButton.disabled = false;

        const resultCount = placeMap.size;

        if (resultCount > 0) {
          setStatus(
            settings.label + " 검색 결과 " +
            resultCount + "개를 표시했습니다."
          );
        } else if (errorCount > 0) {
          setStatus(
            "검색 API 오류가 발생했습니다. " +
            "F12의 Console에서 검색 상태와 API 설정을 확인하세요."
          );
        } else if (zeroResultCount === keywords.length) {
          setStatus(
            "검색 결과가 없습니다. 지도를 이동하거나 다른 검색어를 입력해 보세요."
          );
        } else {
          setStatus(
            "검색 결과가 없습니다. 다른 지역이나 검색어를 시도해 보세요."
          );
        }
      }
    }

    // 탭을 누르면 이전 결과를 지우고 새 검색을 시작합니다.
    tabButtons.forEach(function(button) {
      button.addEventListener("click", function() {
        currentTab = button.dataset.tab;

        tabButtons.forEach(function(tabButton) {
          const isActive = tabButton === button;

          tabButton.classList.toggle("active", isActive);
          tabButton.setAttribute(
            "aria-selected",
            String(isActive)
          );
        });

        searchInput.value = "";
        searchPlaces(currentTab, "");
      });
    });

    // 검색 버튼 또는 Enter 키로 검색합니다.
    searchForm.addEventListener("submit", function(event) {
      event.preventDefault();

      searchPlaces(
        currentTab,
        searchInput.value.trim()
      );
    });

    // 현재 위치를 별도의 마커로 표시합니다.
    function locateUser() {
      if (!navigator.geolocation) {
        setStatus("현재 위치 기능을 사용할 수 없습니다. 기본 위치를 표시합니다.");
        searchPlaces(currentTab, "");
        return;
      }

      setStatus("현재 위치를 확인하고 있습니다.");

      navigator.geolocation.getCurrentPosition(
        function(position) {
          currentPosition = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );

          // 지도 중심을 현재 위치로 이동합니다.
          map.setCenter(currentPosition);
          map.setLevel(mapLevel);

          // 현재 위치 마커를 생성합니다.
          currentMarker = new kakao.maps.Marker({
            map: map,
            position: currentPosition,
            image: createMarkerImage("#20b9a6"),
            title: "내 현재 위치"
          });

          // 현재 위치 마커에도 팝업을 연결합니다.
          kakao.maps.event.addListener(
            currentMarker,
            "click",
            function() {
              const content = document.createElement("div");
              content.style.cssText = "padding:10px;font-size:13px;";
              content.textContent = "내 현재 위치";

              infoWindow.setContent(content);
              infoWindow.open(map, currentMarker);
            }
          );

          // 현재 위치를 가져온 다음 첫 번째 탭을 검색합니다.
          searchPlaces(currentTab, "");
        },
        function(error) {
          // 위치 권한이 거부되어도 기본 위치에서 검색합니다.
          currentPosition = null;

          if (error.code === error.PERMISSION_DENIED) {
            setStatus("위치 권한이 거부되었습니다. 서울시청 주변을 검색합니다.");
          } else {
            setStatus("현재 위치를 확인하지 못했습니다. 기본 위치를 검색합니다.");
          }

          searchPlaces(currentTab, "");
        },
        {
          enableHighAccuracy: false,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    }

    // 카카오맵 SDK가 준비된 후 지도와 검색 기능을 실행합니다.
    if (window.kakao && window.kakao.maps) {
      kakao.maps.load(function() {
        try {
          // 지도 객체를 먼저 생성합니다.
          map = new kakao.maps.Map(
            document.getElementById("map"),
            {
              center: new kakao.maps.LatLng(
                defaultLatitude,
                defaultLongitude
              ),
              level: mapLevel
            }
          );

          // 지도 생성 후 검색 서비스와 팝업을 초기화합니다.
          placesService = new kakao.maps.services.Places(map);

          infoWindow = new kakao.maps.InfoWindow({
            zIndex: 10
          });

          // 지도와 검색 서비스가 준비된 다음 위치를 확인합니다.
          locateUser();

        } catch (error) {
          console.error("지도 초기화 오류:", error);
          setStatus(
            "지도 초기화에 실패했습니다. JavaScript 키와 Web 도메인을 확인하세요."
          );
        }
      });
    } else {
      setStatus(
        "카카오맵 SDK를 불러오지 못했습니다. 네트워크, JavaScript 키, Web 도메인을 확인하세요."
      );
    }
  </script>
</body>
</html>
