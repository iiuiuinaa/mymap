
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장소 검색 서비스</title>

  <style>
    /* 모든 요소의 크기 계산 방식을 통일합니다. */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #222;
    }

    /* 화면을 왼쪽과 오른쪽으로 나눕니다. */
    .container {
      display: flex;
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }

    /* 왼쪽 검색 영역 */
    .sidebar {
      width: 380px;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      padding: 24px 18px;
      border-right: 1px solid #ddd;
      background: #fff;
      z-index: 1;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 24px;
    }

    .search-form {
      display: flex;
      gap: 8px;
    }

    #searchInput {
      width: 100%;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline-color: #4285f4;
    }

    #searchButton {
      flex-shrink: 0;
      padding: 0 16px;
      border: none;
      border-radius: 8px;
      background: #4285f4;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    #searchButton:hover {
      background: #326bd1;
    }

    #status {
      margin: 14px 0;
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    /* 검색 결과 목록 */
    #resultList {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    .result-item {
      padding: 15px 10px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .result-item:hover,
    .result-item:focus {
      background: #f4f7ff;
      outline: none;
    }

    .place-name {
      margin-bottom: 7px;
      font-size: 16px;
      font-weight: bold;
    }

    .place-category,
    .place-address,
    .place-phone {
      margin-top: 5px;
      color: #666;
      font-size: 12px;
      line-height: 1.5;
    }

    .place-link {
      display: inline-block;
      margin-top: 8px;
      color: #2868c7;
      font-size: 12px;
      text-decoration: none;
    }

    .place-link:hover {
      text-decoration: underline;
    }

    /* 오른쪽 지도 영역 */
    #map {
      flex: 1;
      min-width: 0;
      height: 100%;
      background: #f0f2f5;
    }

    /* 작은 화면에서는 검색창을 위쪽에 배치합니다. */
    @media (max-width: 600px) {
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        min-width: 0;
        height: 45%;
        min-height: 230px;
        padding: 14px;
      }

      h1 {
        margin-bottom: 12px;
        font-size: 20px;
      }

      #status {
        margin: 8px 0;
      }

      #map {
        width: 100%;
        height: 55%;
        min-height: 180px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- 왼쪽: 검색창과 검색 결과 -->
    <aside class="sidebar">
      <h1>장소 검색</h1>

      <form class="search-form" id="searchForm">
        <input
          type="text"
          id="searchInput"
          placeholder="장소를 검색하세요"
          aria-label="검색할 장소"
          autocomplete="off"
        >
        <button type="submit" id="searchButton">검색</button>
      </form>

      <p id="status" role="status" aria-live="polite">
        지도를 불러오는 중입니다.
      </p>

      <div id="resultList"></div>
    </aside>

    <!-- 오른쪽: 카카오 지도 -->
    <main id="map" aria-label="장소 검색 지도"></main>
  </div>

  <!-- 카카오 지도 SDK와 장소 검색 라이브러리를 불러옵니다. -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=0bce71f318cc62bbe2897adf4bda0b34&libraries=services&autoload=false"
  ></script>

  <script>
    // 지도의 기본 중심 좌표는 서울시청입니다.
    const defaultLatitude = 37.5665;
    const defaultLongitude = 126.9780;
    const mapLevel = 5;

    // 지도와 검색에 사용할 변수를 준비합니다.
    let map = null;
    let placesService = null;
    let markers = [];
    let infoWindow = null;
    let currentPosition = null;

    const searchForm = document.getElementById("searchForm");
    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const resultList = document.getElementById("resultList");
    const statusText = document.getElementById("status");

    // 화면에 안내 문구를 표시합니다.
    function setStatus(message) {
      statusText.textContent = message;
    }

    // 현재 표시된 검색 마커를 모두 제거합니다.
    function clearMarkers() {
      markers.forEach(function(marker) {
        marker.setMap(null);
      });

      markers = [];
    }

    // 마커와 인포윈도우를 이용해 장소 정보를 표시합니다.
    function showPlace(place) {
      const position = new kakao.maps.LatLng(
        Number(place.y),
        Number(place.x)
      );

      map.setCenter(position);

      // 선택한 장소를 보기 편하도록 확대 레벨을 유지합니다.
      map.setLevel(mapLevel);

      const marker = new kakao.maps.Marker({
        map: map,
        position: position
      });

      markers.push(marker);

      // 장소명은 HTML 문자열로 직접 삽입하지 않고 안전하게 표시합니다.
      const content = document.createElement("div");
      content.style.cssText =
        "padding:10px 12px;font-size:13px;white-space:nowrap;";
      content.textContent = place.place_name;

      infoWindow.setContent(content);
      infoWindow.open(map, marker);
    }

    // 검색 결과를 왼쪽 목록에 표시합니다.
    function displayResults(places) {
      resultList.replaceChildren();
      clearMarkers();

      places.forEach(function(place) {
        const item = document.createElement("article");
        item.className = "result-item";
        item.tabIndex = 0;

        const name = document.createElement("div");
        name.className = "place-name";
        name.textContent = place.place_name;

        const category = document.createElement("div");
        category.className = "place-category";
        category.textContent = place.category_name || "분류 정보 없음";

        const address = document.createElement("div");
        address.className = "place-address";
        address.textContent =
          place.road_address_name || place.address_name || "주소 정보 없음";

        item.append(name, category, address);

        // 전화번호가 제공되는 경우에만 표시합니다.
        if (place.phone) {
          const phone = document.createElement("div");
          phone.className = "place-phone";
          phone.textContent = place.phone;
          item.appendChild(phone);
        }

        // 카카오맵의 장소 상세 페이지를 새 탭에서 엽니다.
        if (place.place_url) {
          const link = document.createElement("a");
          link.className = "place-link";
          link.href = place.place_url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "카카오맵에서 보기";

          // 링크 클릭이 장소 선택 동작으로 이어지지 않도록 합니다.
          link.addEventListener("click", function(event) {
            event.stopPropagation();
          });

          item.appendChild(link);
        }

        // 결과를 클릭하거나 키보드로 선택하면 지도 중심을 이동합니다.
        item.addEventListener("click", function() {
          showPlace(place);
        });

        item.addEventListener("keydown", function(event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            showPlace(place);
          }
        });

        resultList.appendChild(item);

        // 각 검색 결과의 위치에 마커를 표시합니다.
        const marker = new kakao.maps.Marker({
          map: map,
          position: new kakao.maps.LatLng(
            Number(place.y),
            Number(place.x)
          )
        });

        markers.push(marker);

        // 마커를 클릭해도 장소 이름을 확인할 수 있습니다.
        kakao.maps.event.addListener(marker, "click", function() {
          map.setCenter(marker.getPosition());

          const content = document.createElement("div");
          content.style.cssText =
            "padding:10px 12px;font-size:13px;white-space:nowrap;";
          content.textContent = place.place_name;

          infoWindow.setContent(content);
          infoWindow.open(map, marker);
        });
      });
    }

    // 입력한 키워드로 장소를 검색합니다.
    function searchPlaces(keyword) {
      const query = keyword.trim();

      if (!query) {
        setStatus("검색할 장소를 입력해 주세요.");
        searchInput.focus();
        return;
      }

      if (!placesService || !map) {
        setStatus("지도를 준비하고 있습니다. 잠시 후 다시 시도해 주세요.");
        return;
      }

      searchButton.disabled = true;
      setStatus("장소를 검색하고 있습니다.");
      resultList.replaceChildren();

      // 현재 지도 중심을 기준으로 검색합니다.
      placesService.keywordSearch(
        query,
        function(data, status) {
          searchButton.disabled = false;

          if (status === kakao.maps.services.Status.OK) {
            if (data.length === 0) {
              setStatus("검색 결과가 없습니다.");
              return;
            }

            displayResults(data);
            setStatus("검색 결과 " + data.length + "개");

          } else if (
            status === kakao.maps.services.Status.ZERO_RESULT
          ) {
            setStatus("검색 결과가 없습니다.");
            resultList.replaceChildren();
            clearMarkers();

          } else {
            setStatus("검색 중 오류가 발생했습니다. 다시 시도해 주세요.");
          }
        },
        {
          location: map.getCenter(),
          sort: kakao.maps.services.SortBy.DISTANCE,
          size: 15
        }
      );
    }

    // 검색 버튼을 누르거나 Enter 키를 누르면 검색합니다.
    searchForm.addEventListener("submit", function(event) {
      event.preventDefault();
      searchPlaces(searchInput.value);
    });

    // 현재 위치를 가져와 지도의 중심을 이동합니다.
    function locateUser() {
      if (!navigator.geolocation) {
        setStatus("현재 위치 기능을 지원하지 않아 기본 위치로 표시합니다.");
        return;
      }

      setStatus("현재 위치 권한을 확인하고 있습니다.");

      navigator.geolocation.getCurrentPosition(
        function(position) {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          currentPosition = new kakao.maps.LatLng(
            latitude,
            longitude
          );

          // 현재 위치에 별도의 마커를 표시합니다.
          map.setCenter(currentPosition);

          const userMarker = new kakao.maps.Marker({
            map: map,
            position: currentPosition
          });

          markers.push(userMarker);

          setStatus("현재 위치를 표시했습니다. 장소를 검색해 보세요.");
        },
        function(error) {
          // 권한 거부나 위치 확인 실패 시 기본 지도를 유지합니다.
          if (error.code === error.PERMISSION_DENIED) {
            setStatus("위치 권한이 거부되었습니다. 장소를 검색할 수 있습니다.");
          } else {
            setStatus("현재 위치를 확인하지 못했습니다. 장소를 검색해 보세요.");
          }
        },
        {
          enableHighAccuracy: false,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    }

    // SDK 로딩이 완료된 뒤 지도와 검색 기능을 초기화합니다.
    function initializeMap() {
      const mapContainer = document.getElementById("map");

      const mapOption = {
        center: new kakao.maps.LatLng(
          defaultLatitude,
          defaultLongitude
        ),
        level: mapLevel
      };

      // 지도 객체를 생성한 다음에만 지도 관련 기능을 실행합니다.
      map = new kakao.maps.Map(mapContainer, mapOption);

      // 장소 검색 객체와 인포윈도우를 생성합니다.
      placesService = new kakao.maps.services.Places(map);
      infoWindow = new kakao.maps.InfoWindow({
        zIndex: 2
      });

      // 지도가 생성된 뒤 현재 위치를 확인합니다.
      locateUser();
    }

    // SDK 스크립트가 준비된 경우에만 지도 초기화를 시작합니다.
    if (window.kakao && window.kakao.maps) {
      kakao.maps.load(function() {
        try {
          initializeMap();
        } catch (error) {
          console.error("지도 초기화 오류:", error);
          setStatus("지도 초기화에 실패했습니다. API 설정을 확인해 주세요.");
        }
      });
    } else {
      setStatus("카카오 지도 SDK를 불러오지 못했습니다. 네트워크와 API 키를 확인해 주세요.");
    }
  </script>
</body>
</html>
